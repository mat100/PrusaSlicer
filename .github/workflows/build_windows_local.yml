name: Build Windows (self-hosted)

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration'
        default: 'Release'
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      create_pdb:
        description: 'Upload PDB artifacts'
        default: false
        type: boolean

jobs:
  build_win:
    runs-on: [self-hosted, windows]

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CL: "/MP1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Detect Visual Studio
        id: detect-vs
        shell: powershell
        run: |
          $pfx86 = ${env:ProgramFiles(x86)}
          if (-not $pfx86) { $pfx86 = "C:\Program Files (x86)" }
          $vsWhere = "$pfx86\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            Write-Error "vswhere.exe not found at $vsWhere"
            exit 1
          }
          $installPath = & $vsWhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) {
            Write-Error "No Visual Studio installation found with C++ tools"
            exit 1
          }
          $vcvars = "$installPath\VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvars64.bat not found at $vcvars"
            exit 1
          }
          Write-Host "Found vcvars64.bat: $vcvars"
          "vcvars=$vcvars" >> $env:GITHUB_OUTPUT

      - name: Build dependencies
        shell: cmd
        run: |
          call "${{ steps.detect-vs.outputs.vcvars }}"
          cd deps
          if not exist build mkdir build
          cd build
          cmake .. -DDESTDIR="%GITHUB_WORKSPACE%\deps\build\destdir" -DDEP_DEBUG=${{ inputs.config == 'Debug' && 'ON' || 'OFF' }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          cmake --build . --config ${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Build PrusaSlicer
        shell: cmd
        run: |
          call "${{ steps.detect-vs.outputs.vcvars }}"
          if not exist build mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\deps\build\destdir\usr\local" -DCMAKE_CONFIGURATION_TYPES=${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          cmake --build . --config ${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Assemble package
        shell: cmd
        run: |
          set PKG=%GITHUB_WORKSPACE%\package
          mkdir "%PKG%"
          xcopy /E /Y "build\src\${{ inputs.config }}\*" "%PKG%\"
          xcopy /E /Y "C:\Users\supik\actions-runner\resources\*" "%PKG%\"
          del /Q "%PKG%\*.pdb" 2>nul
          del /Q "%PKG%\*.exp" 2>nul
          del /Q "%PKG%\*.lib" 2>nul

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-win64
          path: package/

      - name: Upload PDB
        if: inputs.create_pdb
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-PDB
          path: build/src/${{ inputs.config }}/*.pdb
