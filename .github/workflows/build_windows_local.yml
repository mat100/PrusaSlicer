name: Build Windows (self-hosted)

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Build configuration'
        default: 'Release'
        type: choice
        options: [Release, RelWithDebInfo, Debug]
      create_pdb:
        description: 'Upload PDB artifacts'
        default: false
        type: boolean

jobs:
  build_win:
    runs-on: [self-hosted, windows]

    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CL: "/MP1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Detect Visual Studio
        id: detect-vs
        shell: cmd
        run: |
          for /f "usebackq delims=" %i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%i"
          if not defined VS_PATH echo ::error::No Visual Studio found & exit /b 1
          set "VCVARS=%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist "%VCVARS%" echo ::error::vcvars64.bat not found & exit /b 1
          echo Found vcvars64.bat: %VCVARS%
          echo vcvars=%VCVARS%>> %GITHUB_OUTPUT%

      - name: Build dependencies
        shell: cmd
        run: |
          call "${{ steps.detect-vs.outputs.vcvars }}"
          cd deps
          if not exist build mkdir build
          cd build
          cmake .. -DDESTDIR="%GITHUB_WORKSPACE%\deps\build\destdir" -DDEP_DEBUG=${{ inputs.config == 'Debug' && 'ON' || 'OFF' }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          cmake --build . --config ${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Build PrusaSlicer
        shell: cmd
        run: |
          call "${{ steps.detect-vs.outputs.vcvars }}"
          if not exist build mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%\deps\build\destdir\usr\local" -DCMAKE_CONFIGURATION_TYPES=${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          cmake --build . --config ${{ inputs.config }}
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Assemble package
        shell: cmd
        run: |
          set PKG=%GITHUB_WORKSPACE%\package
          mkdir "%PKG%"
          xcopy /E /Y "build\src\${{ inputs.config }}\*" "%PKG%\"
          xcopy /E /Y "%USERPROFILE%\actions-runner\resources\*" "%PKG%\"
          del /Q "%PKG%\*.pdb" 2>nul
          del /Q "%PKG%\*.exp" 2>nul
          del /Q "%PKG%\*.lib" 2>nul

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-win64
          path: package/

      - name: Upload PDB
        if: inputs.create_pdb
        uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-PDB
          path: build/src/${{ inputs.config }}/*.pdb
